# Built against the locally installed PyCharm (no IDE download).
# Override in ~/.gradle/gradle.properties if the install moves.
platformLocalPath=/home/liebischer/.local/share/JetBrains/Toolbox/apps/pycharm-professional-2

# PyCharm 2026.2 is compiled for Java 25: use its bundled JBR as JDK.
org.gradle.java.installations.paths=/home/liebischer/.local/share/JetBrains/Toolbox/apps/pycharm-professional-2/jbr
org.gradle.java.installations.auto-download=false

# The IDE ships its own Kotlin stdlib.
kotlin.stdlib.default.dependency=false
