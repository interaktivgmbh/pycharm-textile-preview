name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PyCharm 2026.2 is built for Java 25
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches the PyCharm download between runs
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test buildPlugin verifyPluginStructure

      - uses: actions/upload-artifact@v7
        with:
          name: pycharm-textile-preview
          path: build/distributions/*.zip

      - name: Publish the plugin ZIP as GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" build/distributions/*.zip --clobber
